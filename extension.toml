id = "qb64"
name = "QB64-PE"
version = "0.3.1"
schema_version = 1
authors = ["Yegor Platohin <yegor@pterox.me>"]
description = "QB64-PE (Phoenix Edition) language support for Zed: syntax highlighting, auto-indentation, snippets, build tasks, an external formatter and a language server. Warning: this entire project was written by AI, has not been reviewed by its author, and comes with no support or warranty."
repository = "https://github.com/Pterox64/qb64pe-zed"

snippets = ["./snippets/qb64-pe.json"]

[grammars.qb64]
repository = "https://github.com/Pterox64/qb64pe-zed"
rev = "main"
path = "tree-sitter/qb64"

[language_servers.qb64pe]
name = "QB64-PE Language Server"
languages = ["QB64-PE"]

[language_servers.qb64pe.language_ids]
"QB64-PE" = "qb64pe"

[debug_adapters.QB64PE]
